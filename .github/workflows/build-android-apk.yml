name: Build KAIRÓS Android APK from latest Release parts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.5"
          channel: "stable"

      - name: Instalar herramientas
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Mostrar releases disponibles
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Releases disponibles:"
          gh release list

      - name: Descargar partes desde el último Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName')

          if [ -z "$LATEST_TAG" ]; then
            echo "ERROR: No existe ningún Release publicado."
            exit 1
          fi

          echo "Último Release detectado: $LATEST_TAG"

          gh release download "$LATEST_TAG" \
            --pattern "kairos_v04.zip.part*" \
            --dir .

          echo "Partes descargadas:"
          ls -lh kairos_v04.zip.part*

      - name: Verificar cantidad de partes
        run: |
          COUNT=$(ls kairos_v04.zip.part* 2>/dev/null | wc -l)

          echo "Cantidad de partes encontradas: $COUNT"

          if [ "$COUNT" -lt 10 ]; then
            echo "ERROR: Faltan partes. Deben estar part00 a part09."
            ls -lh
            exit 1
          fi

      - name: Unir partes del ZIP
        run: |
          cat kairos_v04.zip.part* > kairos_android_app_v04_mapa_dado_kairos.zip
          echo "ZIP reconstruido:"
          ls -lh kairos_android_app_v04_mapa_dado_kairos.zip

      - name: Descomprimir proyecto KAIRÓS
        run: |
          mkdir -p extracted
          unzip kairos_android_app_v04_mapa_dado_kairos.zip -d extracted
          echo "Contenido descomprimido:"
          find extracted -maxdepth 4 -type f | head -80

      - name: Encontrar carpeta Flutter
        run: |
          PUBSPEC_PATH=$(find extracted -name pubspec.yaml | head -n 1)

          if [ -z "$PUBSPEC_PATH" ]; then
            echo "ERROR: No se encontró pubspec.yaml"
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          echo "Proyecto Flutter encontrado en: $PROJECT_DIR"

      - name: Verificar Flutter
        run: flutter --version

      - name: Crear estructura Android si no existe
        run: |
          cd "$PROJECT_DIR"
          flutter create --platforms=android .

      - name: Descargar dependencias
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Compilar APK release
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Preparar APK
        run: |
          mkdir -p artifact_output
          cp "$PROJECT_DIR/build/app/outputs/flutter-apk/app-release.apk" artifact_output/KAIROS_v0.4.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: KAIROS_v0.4_APK
          path: artifact_output/KAIROS_v0.4.apk
